services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      CRAWLER_DB_PASSWORD: ${CRAWLER_DB_PASSWORD:?set it in .env, see .env.example}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set it in .env, see .env.example}
      LLM_ROUTER_DB_PASSWORD: ${LLM_ROUTER_DB_PASSWORD:?set it in .env, see .env.example}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  crawler:
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
    environment:
      CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-100}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 300s

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 300s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CRAWLER_URL: ${CRAWLER_URL:-http://crawler:8081}
      FRONTEND_URL: ${FRONTEND_URL:-http://frontend:8082}
    depends_on:
      crawler:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pgdata:

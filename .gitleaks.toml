minVersion = "v8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "Generated, cached, and local model artifacts"
paths = [
  '''(^|/)target/''',
  '''(^|/)\.git/''',
  '''(^|/)\.temp/''',
  '''(^|/)\.lycheecache$''',
  '''(^|/)\.env$''',
  '''(^|/)native/[^/]+/models/''',
  '''(^|/)native/[^/]+/\.venv/''',
]

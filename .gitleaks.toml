minVersion = "v8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "Generated, cached, and local model artifacts"
paths = [
  '''(^|/)target/''',
  '''(^|/)\.git/''',
  '''(^|/)\.temp/''',
  '''(^|/)\.lycheecache$''',
  '''(^|/)\.env$''',
  '''(^|/)native/[^/]+/models/''',
  '''(^|/)native/[^/]+/\.venv/''',
]

[[allowlists]]
description = "Historical TTS model API class name, not a credential"
regexTarget = "line"
regexes = ['''"python_api"\s*:\s*"qwen3_tts_ane\.Qwen3TTSANE"''']

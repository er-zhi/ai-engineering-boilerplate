syntax = "proto3";

package crawler.v1;

service CrawlerService {
  rpc StartCrawl(StartCrawlRequest) returns (StartCrawlResponse);
  rpc GetCrawlJob(GetCrawlJobRequest) returns (GetCrawlJobResponse);
  rpc GetPageNeighbors(GetPageNeighborsRequest) returns (GetPageNeighborsResponse);
}

enum CrawlStatus {
  CRAWL_STATUS_UNSPECIFIED = 0;
  CRAWL_STATUS_QUEUED = 1;
  CRAWL_STATUS_RUNNING = 2;
  CRAWL_STATUS_DONE = 3;
  CRAWL_STATUS_FAILED = 4;
}

message CrawlScope {
  repeated string include_patterns = 1;
  repeated string exclude_patterns = 2;
  repeated string include_urls = 3;
  repeated string exclude_urls = 4;
}

message StartCrawlRequest {
  string base_url = 1;
  CrawlScope scope = 2;
  // Optional. Two requests with the same key start one crawl: the second answers with the first one's job.
  string idempotency_key = 3;
}

message StartCrawlResponse {
  string job_id = 1;
  CrawlStatus status = 2;
}

message GetCrawlJobRequest {
  string job_id = 1;
}

message GetCrawlJobResponse {
  string job_id = 1;
  string base_url = 2;
  CrawlStatus status = 3;
  uint32 pages_crawled = 4;
  // 5 was pages_skipped: written as 0 at job creation and never incremented.
  reserved 5;
  reserved "pages_skipped";
}

enum PageRelation {
  PAGE_RELATION_UNSPECIFIED = 0;
  PAGE_RELATION_LINKS_TO = 1;
  PAGE_RELATION_PARENT = 2;
  PAGE_RELATION_CANONICAL = 3;
  PAGE_RELATION_REDIRECT = 4;
}

message GetPageNeighborsRequest {
  string url = 1;
  repeated PageRelation allowed_relation_types = 2;
  uint32 max_depth = 3;
}

message PageNeighbor {
  bool crawled = 1;
  string url = 2;
  string title = 3;
  PageRelation relation = 4;
  uint32 depth = 5;
}

message GetPageNeighborsResponse {
  repeated PageNeighbor shallowest_first_neighbors = 1;
}

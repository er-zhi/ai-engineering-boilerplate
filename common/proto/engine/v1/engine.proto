syntax = "proto3";

package engine.v1;

service EngineService {
  rpc RegisterGraph(RegisterGraphRequest) returns (RegisterGraphResponse);
  rpc StartExecution(StartExecutionRequest) returns (StartExecutionResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc GetExecution(GetExecutionRequest) returns (Execution);
  rpc StreamEvents(StreamEventsRequest) returns (stream ExecutionEvent);
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
}

message RegisterGraphRequest {
  string graph_id = 1;
  // The graph definition as JSON. Graphs are dynamic by design, so this stays opaque text rather
  // than typed proto messages; its fields, their types and what registration validates are
  // specified in services/engine/README.md under "The Graph JSON Contract".
  string definition_json = 2;
}

message RegisterGraphResponse {
  string graph_id = 1;
  int32 version = 2;
}

message StartExecutionRequest {
  string graph_id = 1;
  optional int32 version = 2; // unset = latest registered version at call time
  // Merged into the fresh execution's initial state. The fields the built-in graphs read are the
  // `common::execution_input::ExecutionInput` type both sides build and parse; a graph of your own
  // may read anything it likes.
  string input_json = 3;
  // An execution this one continues. What that execution's sources returned is carried into this
  // one's initial state, so a follow-up can be answered from material already fetched rather than
  // fetched again — or, where nothing new can be fetched, answered at all.
  //
  // Only the material is carried, never the run-time representation: what an execution is doing
  // stays private to this service, which is why `Execution` does not publish it either.
  optional string continues_execution_id = 4;
}

message StartExecutionResponse {
  string execution_id = 1;
}

message InterruptRequest {
  string execution_id = 1;
  string input_json = 2;
}

message InterruptResponse {}

message ResumeRequest {
  // 2 was wait_key: the key a Wait node parks on, accepted from callers and never checked against
  // the execution's actual WaitKind. Nothing sets it, and the only wait kinds a graph can reach
  // today carry no key. It comes back with a new number when approvals and Subgraph are wired.
  reserved 2;
  reserved "wait_key";
  string execution_id = 1;
  string event_json = 3;
}

message ResumeResponse {}

message CancelRequest {
  string execution_id = 1;
}

message CancelResponse {}

message GetExecutionRequest {
  string execution_id = 1;
}

// Where an execution has got to. The engine maps its own run-time status onto this set at the
// boundary, so a caller reads the state machine rather than a spelling it has to know by heart.
enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_READY = 1;
  EXECUTION_STATUS_RUNNING = 2;
  EXECUTION_STATUS_WAITING = 3;
  EXECUTION_STATUS_COMPLETED = 4;
  EXECUTION_STATUS_FAILED = 5;
  EXECUTION_STATUS_CANCELLED = 6;
}

message Execution {
  // 5 was a status string whose vocabulary lived in a comment; 6..9 were wait_kind_json,
  // current_nodes_json, iteration and state_json: the engine's private run-time representation
  // shipped as opaque strings, which no client could read without linking the engine's own crate.
  // What an execution is doing is declared by StreamEvents instead.
  reserved 5 to 9;
  reserved "current_nodes_json", "iteration", "state_json", "wait_kind_json";
  string execution_id = 1;
  string graph_id = 2;
  int32 graph_version = 3;
  optional string user_id = 4;
  ExecutionStatus status = 10;
}

message StreamEventsRequest {
  // Exactly one of these is set — by execution (a chat topic's own transcript) or by user (a
  // panel across every topic in a session).
  optional string execution_id = 1;
  optional string user_id = 2;
}

// Everything that can happen to an execution. The engine projects its stored event log onto this
// set; a stored event this engine no longer knows arrives as UNSPECIFIED rather than as a name
// the client would have to guess at.
enum ExecutionEventKind {
  EXECUTION_EVENT_KIND_UNSPECIFIED = 0;
  EXECUTION_EVENT_KIND_EXECUTION_STARTED = 1;
  EXECUTION_EVENT_KIND_NODE_STARTED = 2;
  EXECUTION_EVENT_KIND_NODE_COMPLETED = 3;
  EXECUTION_EVENT_KIND_NODE_FAILED = 4;
  EXECUTION_EVENT_KIND_TASK_OUTPUT = 5;
  EXECUTION_EVENT_KIND_WAITING = 6;
  EXECUTION_EVENT_KIND_RESUMED = 7;
  EXECUTION_EVENT_KIND_INTERRUPTED = 8;
  EXECUTION_EVENT_KIND_EXECUTION_COMPLETED = 9;
  EXECUTION_EVENT_KIND_EXECUTION_FAILED = 10;
  EXECUTION_EVENT_KIND_EXECUTION_CANCELLED = 11;
}

message ExecutionEvent {
  string id = 1;
  string execution_id = 2;
  optional string user_id = 3;
  int32 version = 4;
  optional string causation_id = 5;
  string occurred_at = 6; // RFC 3339
  ExecutionEventKind payload_kind = 7;
  // The fields of this kind alone — `{"node": "llm", "output": {...}}` for NODE_COMPLETED,
  // `{"final_state": {...}, "result": ...}` for EXECUTION_COMPLETED, `{}` for a kind with no
  // fields. Never an envelope keyed by the kind.
  string payload_json = 8;
  // The graph's answer, resolved by the engine from the pointer the graph declares (see
  // services/engine/README.md). Set on EXECUTION_COMPLETED, and only when the graph declares
  // where its answer lives and that pointer resolved.
  optional string result = 9;
  // Set on EXECUTION_FAILED and NODE_FAILED.
  optional string error = 10;
}

// A standing instruction to start a fresh execution of `graph_id` on a cron schedule — a cron
// daemon over the same StartExecution every other client calls, not a second execution model.
message CreateScheduleRequest {
  string graph_id = 1;
  optional int32 version = 2; // unset = whichever version is latest when the schedule fires
  // Six fields (sec min hour day-of-month month day-of-week) plus an optional year, the `cron`
  // crate's format — "0 0 * * * *" is hourly on the hour, not classic 5-field crontab.
  string cron_expr = 3;
  string input_json = 4; // the initial state of every execution this schedule starts
}

message CreateScheduleResponse {
  string schedule_id = 1;
}

// Scoped to the caller's Principal, like StartExecution — no body field selects another user.
message ListSchedulesRequest {}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
}

message Schedule {
  string id = 1;
  string graph_id = 2;
  string cron_expr = 3;
  bool enabled = 4;
  string next_run_at = 5; // RFC 3339
  optional string last_execution_id = 6;
}

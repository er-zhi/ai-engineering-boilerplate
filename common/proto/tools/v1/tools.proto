syntax = "proto3";

package tools.v1;

service ToolService {
  rpc CreateTool(CreateToolRequest) returns (CreateToolResponse);
  rpc ValidateTool(ValidateToolRequest) returns (ValidateToolResponse);
  rpc ActivateTool(ActivateToolRequest) returns (ActivateToolResponse);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}

enum ToolRisk {
  TOOL_RISK_UNSPECIFIED = 0;
  TOOL_RISK_READ_ONLY = 1;
  TOOL_RISK_WRITE = 2;
  TOOL_RISK_DESTRUCTIVE = 3;
}

enum ToolStatus {
  TOOL_STATUS_UNSPECIFIED = 0;
  TOOL_STATUS_DRAFT = 1;
  TOOL_STATUS_VALIDATED = 2;
  TOOL_STATUS_ACTIVE = 3;
}

enum ExecuteStatus {
  EXECUTE_STATUS_UNSPECIFIED = 0;
  EXECUTE_STATUS_OK = 1;
  EXECUTE_STATUS_REQUIRES_APPROVAL = 2;
  EXECUTE_STATUS_ERROR = 3;
  EXECUTE_STATUS_NOT_EXECUTABLE = 4;
}

message CreateToolRequest {
  string slug = 1;
  string name = 2;
  string description = 3;
  string input_schema_json = 4;
  string output_schema_json = 5;
  ToolRisk risk = 6;
  int32 timeout_seconds = 7;
}
message CreateToolResponse {
  string tool_id = 1;
}

message ValidateToolRequest {
  string tool_id = 1;
}
message ValidateToolResponse {
  bool approved = 1;
  string feedback = 2;
}

message ActivateToolRequest {
  string tool_id = 1;
}
message ActivateToolResponse {}

message ListToolsRequest {}
message ListToolsResponse {
  repeated Tool tools = 1;
}
message Tool {
  string id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  string input_schema_json = 5;
  ToolRisk risk = 6;
  ToolStatus status = 7;
}

message ExecuteRequest {
  string slug = 1;
  string input_json = 2;
  string idempotency_key = 3;
}
message ExecuteResponse {
  ExecuteStatus status = 1;
  string output_json = 2;
  string error_message = 3;
}

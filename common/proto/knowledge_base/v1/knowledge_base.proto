syntax = "proto3";

package knowledge_base.v1;

service KnowledgeBaseService {
  rpc Ingest(IngestRequest) returns (IngestResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc ReadDocument(ReadDocumentRequest) returns (ReadDocumentResponse);
}

message DocumentRef {
  string source = 1;
  string source_id = 2;
  // SHA-256 content version returned by Search; prevents mixing revisions while reading pages.
  string version = 3;
}

message IngestRequest {
  string source = 1;
  string source_id = 2;
  string title = 3;
  string content = 4;
}

message IngestResponse {
  bool stored = 1;
  // True when the content hash matched an existing document: no LLM or embedding call was made.
  bool skipped = 2;
}

// What a stored page is, as knowledge-base classified it while ingesting.
enum PageType {
  PAGE_TYPE_UNSPECIFIED = 0;
  PAGE_TYPE_OTHER = 1;
  PAGE_TYPE_PRODUCT = 2;
  PAGE_TYPE_KNOWLEDGE = 3;
  PAGE_TYPE_INSTRUCTION = 4;
  PAGE_TYPE_DOCUMENTATION = 5;
  PAGE_TYPE_BLOG = 6;
}

message SearchRequest {
  reserved 2; // was a repeated page-type string whose vocabulary lived in this comment
  string query = 1;
  // Restricts results to these page types. Empty means every type.
  repeated PageType page_types = 4;
  // How many documents to return: 0 means 10, at most 50.
  uint32 limit = 3;
}

message SearchResult {
  reserved 5; // was a page-type string whose vocabulary lived in SearchRequest's comment
  string source = 1;
  string source_id = 2;
  string title = 3;
  string summary = 4;
  PageType page_type = 12;
  float score = 6;
  repeated string keywords = 7;
  // The passage of this document that matched the query best.
  string snippet = 8;
  // RFC 3339; when knowledge-base last stored a changed version of this document.
  string updated_at = 9;
  // Stable external identity and the exact revision this result came from.
  DocumentRef document = 10;
  // Zero-based position of the matching passage inside this document revision.
  uint32 passage_ordinal = 11;
}

message SearchResponse {
  // At most `limit` documents, highest score first.
  repeated SearchResult results = 1;
}

message ReadDocumentRequest {
  DocumentRef document = 1;
  // Opaque cursor returned by the previous page; empty starts at the beginning.
  string cursor = 2;
  // Characters to return: 0 means 16,000, at most 50,000.
  uint32 max_chars = 3;
}

message ReadDocumentResponse {
  DocumentRef document = 1;
  string title = 2;
  string content = 3;
  // Empty when the complete document revision has been returned.
  string next_cursor = 4;
  uint32 total_chars = 5;
}

# Dev mode: source is mounted and watchexec rebuilds on save. Applied automatically by `docker compose up`.
services:
  crawler:
    build:
      target: dev
    volumes:
      - .:/w
      - cargo-registry:/usr/local/cargo/registry
      - target:/w/target

  frontend:
    build:
      target: dev
    volumes:
      - .:/w
      - cargo-registry:/usr/local/cargo/registry
      - target:/w/target

  gateway:
    build:
      target: dev
    volumes:
      - .:/w
      - cargo-registry:/usr/local/cargo/registry
      - target:/w/target

volumes:
  cargo-registry:
  target:

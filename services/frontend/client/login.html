<!doctype html>
<meta charset="utf-8">
<title>Log In</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
  input { width: 100%; padding: .5rem; font: inherit; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 1rem; padding: .5rem 1.2rem; font: inherit; cursor: pointer; }
</style>

<h1>Log In</h1>

<form method="post" action="/login">
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button type="submit">Log in</button>
</form>

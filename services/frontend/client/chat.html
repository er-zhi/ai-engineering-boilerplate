<!doctype html>
<meta charset="utf-8">
<title>Chat</title>
<style>
  /* The whole page is exactly one viewport tall and never scrolls as a document: each pane
     (transcript, topic list, debug log) owns its own scrollbar instead, so the layout stays put
     however many topics the session accumulates. Every ancestor of a scrolling pane needs
     `min-height: 0` — a flex item's default `min-height: auto` refuses to shrink below its
     content, which is what would otherwise push the page past 100vh. */
  body { font: 14px/1.5 system-ui, sans-serif; height: 100vh; box-sizing: border-box; margin: 0; padding: 1.5rem 1rem; overflow: hidden; display: flex; gap: 1.5rem; }
  .logout { position: absolute; top: 1.5rem; right: 1rem; }
  .logout button { background: none; border: none; text-decoration: underline; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; flex-shrink: 0; }
  .left { flex: 0 0 50%; min-width: 0; min-height: 0; overflow: hidden; display: flex; gap: 1.5rem; }
  main { flex: 1; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  aside { width: 16rem; flex-shrink: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  #topics { flex: 1; min-height: 0; overflow-y: auto; }
  aside h2 { font-size: 0.9rem; color: #666; margin: 0 0 .5rem; flex-shrink: 0; }
  .topic-row { padding: .5rem; border-radius: 4px; cursor: pointer; margin-bottom: .25rem; }
  .topic-row:hover { background: #f4f4f4; }
  .topic-row.focus { background: #eef; font-weight: 600; }
  .topic-row .status { color: #666; font-size: .8em; }
  /* Stays pinned below the scrolling topic list rather than scrolling away with it. */
  #newSession { width: 100%; margin-top: .5rem; padding: .5rem; cursor: pointer; flex-shrink: 0; }
  /* Which topic a line belongs to. One transcript carries every topic's turns, so without this
     label an answer from a background topic reads as a reply to the last thing typed. */
  .msg .topic { color: #66a; font-size: .75em; margin-right: .35em; }
  #transcript { flex: 1; min-height: 0; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; padding: .75rem; margin-bottom: .75rem; }
  .msg { padding: .4rem 0; border-bottom: 1px solid #f4f4f4; }
  .msg.notification { color: #444; font-style: italic; }
  .msg .kind { color: #999; font-size: .75em; }
  .msg code { background: #f4f4f4; border-radius: 3px; padding: .1em .3em; font: 12px/1.4 ui-monospace, monospace; }
  .msg strong { font-weight: 600; }
  .msg ul, .msg ol { margin: .3em 0; padding-left: 1.4em; }
  .msg h1, .msg h2, .msg h3 { font-size: 1em; margin: .5em 0 .2em; }
  form#sendForm { display: flex; gap: .5rem; flex-shrink: 0; }
  #content { flex: 1; padding: .5rem; font: inherit; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: .5rem 1.2rem; font: inherit; cursor: pointer; }
  .error { color: #b00; }
  aside.debug { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; }
  aside.debug h2 { display: flex; justify-content: space-between; align-items: center; }
  aside.debug h2 button { font-size: .75em; padding: .15rem .5rem; }
  aside.debug h2 { flex-shrink: 0; }
  #debugLog { flex: 1; min-height: 0; overflow-y: auto; background: #1e1e1e; color: #ddd; font: 11px/1.5 ui-monospace, monospace; border-radius: 4px; padding: .5rem; }
  .debug-entry { padding: .2rem 0; border-bottom: 1px solid #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .debug-entry.open { white-space: pre-wrap; word-break: break-all; }
  .debug-entry .ts { color: #888; }
  .debug-entry .kind { color: #7fc; }
  .debug-entry .topic { color: #fc7; }
  .debug-entry.meta { color: #999; font-style: italic; }
  .debug-entry.err { color: #f77; }
</style>

<form class="logout" method="post" action="/logout"><button type="submit">Log out</button></form>

<div class="left">
  <main>
    <h1>Chat</h1>
    <div id="transcript"></div>
    <form id="sendForm">
      <input id="content" placeholder="Ask something…" autofocus>
      <button type="submit">Send</button>
    </form>
  </main>

  <aside>
    <h2>Topics</h2>
    <div id="topics"></div>
    <button id="newSession" type="button">New session</button>
  </aside>
</div>

<aside class="debug" id="debugPanel">
  <h2>Session debug <button id="debugClear" type="button">clear</button></h2>
  <div id="debugLog"></div>
</aside>

<script>
  const SERVICE = "/chat.v1.ChatService";
  const transcript = document.getElementById("transcript");
  const topicsEl = document.getElementById("topics");
  const debugLog = document.getElementById("debugLog");
  const DEBUG_MAX_ENTRIES = 500;
  let focusTopicId = null;
  // What the server last told us its focus is — `focusTopicId` is what we're *showing*, and the
  // two diverge whenever a topic completes (the server moves focus on, or clears it).
  let serverFocusTopicId = null;
  let topics = [];

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // Everything observable about this session: every RPC call/response, every stream event (not
  // just the focused topic's), connection lifecycle, and errors — a running log of what the
  // client sees, independent of what the transcript chooses to render.
  function debugLine(className, kindText, detail) {
    const entry = element("div", `debug-entry ${className}`);
    entry.appendChild(element("span", "ts", `${new Date().toLocaleTimeString()} `));
    if (kindText) entry.appendChild(element("span", "kind", `${kindText} `));
    entry.appendChild(document.createTextNode(detail));
    entry.onclick = () => entry.classList.toggle("open");
    debugLog.appendChild(entry);
    while (debugLog.children.length > DEBUG_MAX_ENTRIES) debugLog.removeChild(debugLog.firstChild);
    debugLog.scrollTop = debugLog.scrollHeight;
  }

  document.getElementById("debugClear").onclick = () => { debugLog.textContent = ""; };

  async function callRpc(method, message) {
    debugLine("meta", `→ ${method}`, JSON.stringify(message));
    let res;
    try {
      res = await fetch(`${SERVICE}/${method}`, {
        method: "POST",
        headers: { "content-type": "application/json", "connect-protocol-version": "1" },
        body: JSON.stringify(message),
      });
    } catch (err) {
      debugLine("err", `✗ ${method}`, err.message);
      throw err;
    }
    const body = await res.json();
    if (!res.ok) {
      debugLine("err", `✗ ${method} (${res.status})`, JSON.stringify(body));
      throw new Error(body.message || `${method} failed with ${res.status}`);
    }
    debugLine("meta", `← ${method}`, JSON.stringify(body));
    return body;
  }

  // Connect streaming wire format: each message is a 5-byte header (1 flag byte, 0x02 =
  // end-stream; 4 big-endian length bytes) followed by that many bytes of JSON. The single
  // request message for a server-streaming call is itself one such envelope, not bare JSON.
  function encodeEnvelope(message) {
    const json = new TextEncoder().encode(JSON.stringify(message));
    const out = new Uint8Array(5 + json.length);
    new DataView(out.buffer).setUint32(1, json.length, false);
    out.set(json, 5);
    return out;
  }

  function concatBytes(a, b) {
    const out = new Uint8Array(a.length + b.length);
    out.set(a, 0);
    out.set(b, a.length);
    return out;
  }

  async function* streamChatEvents() {
    const res = await fetch(`${SERVICE}/StreamEvents`, {
      method: "POST",
      headers: { "content-type": "application/connect+json", "connect-protocol-version": "1" },
      body: encodeEnvelope({}),
    });
    if (!res.ok || !res.body) throw new Error(`StreamEvents failed with ${res.status}`);
    const reader = res.body.getReader();
    let buffer = new Uint8Array(0);
    while (true) {
      const { done, value } = await reader.read();
      if (done) return;
      buffer = concatBytes(buffer, value);
      while (buffer.length >= 5) {
        const flag = buffer[0];
        const length = new DataView(buffer.buffer, buffer.byteOffset + 1, 4).getUint32(0, false);
        if (buffer.length < 5 + length) break;
        const payload = buffer.slice(5, 5 + length);
        buffer = buffer.slice(5 + length);
        if (flag & 0x02) return; // end-stream envelope
        yield JSON.parse(new TextDecoder().decode(payload));
      }
    }
  }

  function progressText(payloadJson) {
    let payload;
    try { payload = JSON.parse(payloadJson); } catch { return payloadJson; }
    const [kind, body] = Object.entries(payload)[0] || ["", {}];
    if (kind === "NodeStarted") return `Running ${body.node}…`;
    if (kind === "TaskOutput" && typeof body.chunk === "string") return body.chunk;
    if (kind === "NodeCompleted") return `${body.node} done`;
    return kind;
  }

  // Tiny, safe markdown renderer for assistant answers: escapes HTML first (so the input can
  // never inject markup), then converts a small subset of markdown syntax to tags. No external
  // libraries — CSP allows none.
  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderInline(text) {
    return escapeHtml(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
      .replace(/_([^_\n]+)_/g, "<em>$1</em>");
  }

  function renderMarkdown(text) {
    const lines = text.split("\n");
    const htmlParts = [];
    let listTag = null; // "ul" or "ol" while inside a list
    let paragraph = [];

    function flushParagraph() {
      if (paragraph.length) {
        htmlParts.push(`<p>${paragraph.map(renderInline).join("<br>")}</p>`);
        paragraph = [];
      }
    }
    function closeList() {
      if (listTag) {
        htmlParts.push(`</${listTag}>`);
        listTag = null;
      }
    }

    for (const rawLine of lines) {
      const line = rawLine.trim();
      const heading = /^(#{1,3})\s+(.*)$/.exec(line);
      const listItem = /^(?:[-*]\s+|\d+\.\s+)(.*)$/.exec(line);
      if (line === "") {
        flushParagraph();
        closeList();
      } else if (heading) {
        flushParagraph();
        closeList();
        const level = heading[1].length;
        htmlParts.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
      } else if (listItem) {
        flushParagraph();
        const isOrdered = /^\d+\.\s+/.test(line);
        const tag = isOrdered ? "ol" : "ul";
        if (listTag !== tag) {
          closeList();
          htmlParts.push(`<${tag}>`);
          listTag = tag;
        }
        htmlParts.push(`<li>${renderInline(listItem[1])}</li>`);
      } else {
        closeList();
        paragraph.push(line);
      }
    }
    flushParagraph();
    closeList();
    return htmlParts.join("");
  }

  // One transcript for the whole session: every topic's turns and answers interleaved in time,
  // each tagged with the topic it belongs to — the Claude Code model, where background work
  // reports back into the one conversation rather than into a pane of its own.
  function appendMessage(who, text, className, topicTitle) {
    const div = element("div", `msg ${className || ""}`);
    if (topicTitle) div.appendChild(element("span", "topic", `[${topicTitle}]`));
    div.appendChild(element("span", "kind", `${who} `));
    if (who === "assistant") {
      const body = element("span");
      body.innerHTML = renderMarkdown(text);
      div.appendChild(body);
    } else {
      div.appendChild(document.createTextNode(text));
    }
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
    return div;
  }

  // The label tag always names the root conversation, never a child's own (possibly synthesized)
  // title — a child topic is just more turns in the same thread, so its tag must not "flip" to
  // whatever the classifier called the follow-up.
  function rootTitleOf(topicId) {
    const byId = new Map(topics.map((t) => [t.id, t]));
    let cur = byId.get(topicId);
    if (!cur) return topicId;
    const seen = new Set();
    while (cur.parentId && byId.has(cur.parentId) && !seen.has(cur.id)) {
      seen.add(cur.id);
      cur = byId.get(cur.parentId);
    }
    return cur.title;
  }

  // Rebuilt from GetSession alone, so it is idempotent: a reload, a topic switch and a lifecycle
  // event all produce the same transcript for the same server state.
  //
  // `Topic.question` is never trusted as something the user said: it is synthesized by the
  // backend for child topics ("Earlier answer: … Follow-up: …") and may be rephrased by the
  // classifier even for a root topic. The user's real turns live only in `messages`. So: a topic
  // with at least one message contributes only those messages as user lines; a topic with zero
  // messages (a root topic the classifier split out of a multi-topic first message, whose message
  // row lives on a sibling topic) contributes its `title` instead, once. Everything is then
  // sorted by timestamp, which is what interleaves parallel topics into one readable thread.
  function transcriptEntries() {
    const entries = [];
    topics.forEach((topic) => {
      const messages = topic.messages || [];
      const tag = rootTitleOf(topic.id);
      if (messages.length) {
        messages.forEach((message) => {
          entries.push({ at: message.createdAt, who: "you", text: message.content, topic: tag });
        });
      } else if (topic.title) {
        entries.push({ at: topic.createdAt, who: "you", text: topic.title, topic: tag });
      }
      if (topic.resultSummary && (topic.status === "completed" || topic.status === "failed")) {
        entries.push({
          at: topic.updatedAt,
          who: "assistant",
          text: topic.resultSummary,
          className: topic.status === "failed" ? "error" : "",
          topic: tag,
        });
      } else if (topic.status === "running" || topic.status === "queued") {
        entries.push({
          at: topic.updatedAt,
          who: "assistant",
          text: `(${topic.status}…)`,
          className: "notification",
          topic: tag,
        });
      }
    });
    return entries.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
  }

  function renderTranscript() {
    transcript.textContent = "";
    transcriptEntries().forEach((entry) => {
      appendMessage(entry.who, entry.text, entry.className, entry.topic);
    });
  }

  // Lifecycle events change what GetSession would say, so they are rendered by reloading and
  // re-rendering (idempotent, see renderTranscript). Everything else — progress, notifications —
  // is appended in place, because it is never part of the snapshot.
  const LIFECYCLE = new Set([
    "topic_created", "topic_started", "topic_queued", "topic_completed", "topic_failed",
    "topic_cancelled", "focus_changed",
  ]);

  // A single malformed or unexpected event must never kill the stream: `StreamEvents` replays
  // the session's *entire* persisted history on every reconnect, so an uncaught throw here would
  // die on the same event every time the client reconnects — freezing the transcript forever,
  // since every later lifecycle event (including the one that would finish a running topic)
  // never gets a chance to run again. Any failure is logged to the debug panel instead.
  async function renderEvent(event) {
    try {
      debugLine("", `event ${event.kind}`, `topic=${event.topicId || "-"} ${event.payloadJson || ""}`);
      if (event.kind === "session_reset") {
        await startOver();
        return;
      }
      if (LIFECYCLE.has(event.kind)) {
        scheduleReload();
        return;
      }
      let payload = {};
      try { payload = JSON.parse(event.payloadJson || "{}"); } catch { /* not JSON — ignore */ }
      if (event.kind === "notification") {
        appendMessage("·", payload.text || payload.kind || "", "notification", rootTitleOf(event.topicId));
        return;
      }
      if (event.kind === "topic_progress") {
        appendMessage("·", progressText(event.payloadJson), "notification", rootTitleOf(event.topicId));
      }
    } catch (err) {
      debugLine("err", `render ${event.kind}`, err.message);
    }
  }

  function renderTopics() {
    topicsEl.textContent = "";
    topics.forEach((topic) => {
      const row = element("div", `topic-row ${topic.id === focusTopicId ? "focus" : ""}`);
      row.appendChild(element("div", "", topic.title));
      row.appendChild(element("div", "status", topic.status));
      row.onclick = () => setFocus(topic.id);
      topicsEl.appendChild(row);
    });
  }

  // The topic list is navigation and status only: clicking a row moves the server's focus and
  // highlights it. The transcript is session-wide, so it does not change.
  async function setFocus(topicId) {
    if (topicId === focusTopicId) return;
    await callRpc("SetFocus", { topicId });
    focusTopicId = topicId;
    serverFocusTopicId = topicId;
    renderTopics();
  }

  // A reconnect replays the session's whole stored history, which is dozens of lifecycle events
  // in a burst — one GetSession each would be a storm of identical calls. They all want the same
  // thing (the current snapshot), so they collapse into one trailing reload.
  let reloadTimer = null;
  function scheduleReload() {
    if (reloadTimer) return;
    reloadTimer = setTimeout(() => {
      reloadTimer = null;
      loadSession().catch((err) => debugLine("err", "GetSession", err.message));
    }, 50);
  }

  async function loadSession() {
    const session = await callRpc("GetSession", {});
    topics = session.topics || [];
    serverFocusTopicId = session.focusTopicId || null;
    // When the last unfinished topic completes the server clears focus, so fall back to the
    // newest topic — that is the conversation the user was just reading. It only decides which
    // row is highlighted; the classifier, not this pointer, decides where a turn lands.
    focusTopicId = serverFocusTopicId || (topics.length && topics[topics.length - 1].id) || null;
    renderTopics();
    renderTranscript();
  }

  document.getElementById("sendForm").onsubmit = async (event) => {
    event.preventDefault();
    const input = document.getElementById("content");
    const content = input.value.trim();
    // Always sendable: an empty session is how a first topic gets created now, so there is
    // nothing to be focused on first.
    if (!content) return;
    input.value = "";
    appendMessage("you", content);
    try {
      // The server classifies the message against the whole session — it may continue a topic,
      // or open one, or open several — so the client asserts no focus beforehand and simply
      // follows whatever comes back.
      const sent = await callRpc("SendTurn", { turnId: crypto.randomUUID(), content });
      const routed = (sent.topicIds && sent.topicIds[0]) || sent.topicId || null;
      if (routed) {
        focusTopicId = routed;
        serverFocusTopicId = routed;
      }
      await loadSession();
    } catch (err) {
      appendMessage("!", err.message, "error");
    }
  };

  // Wipes the whole session (every topic, every message) and starts fresh. Also reachable from
  // another tab's own click via the `session_reset` stream event below, so both tabs land in the
  // same empty state instead of one of them still showing topics that no longer exist server-side.
  async function startOver() {
    transcript.textContent = "";
    topics = [];
    focusTopicId = null;
    serverFocusTopicId = null;
    await loadSession();
  }

  document.getElementById("newSession").onclick = async () => {
    if (!confirm("Start over? This deletes all topics.")) return;
    try {
      await callRpc("ResetSession", {});
      await startOver();
    } catch (err) {
      appendMessage("!", err.message, "error");
    }
  };

  (async () => {
    await loadSession();
    for (;;) {
      debugLine("meta", "stream", "connecting…");
      try {
        for await (const event of streamChatEvents()) {
          await renderEvent(event);
        }
        debugLine("meta", "stream", "ended cleanly");
      } catch (err) {
        debugLine("err", "stream", `${err.message} — retrying in 2s`);
        appendMessage("!", `Stream error: ${err.message} — retrying…`, "error");
      }
      await new Promise((resolve) => setTimeout(resolve, 2000));
    }
  })();
</script>

<!doctype html>
<meta charset="utf-8">
<title>Knowledge Base</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; margin-bottom: .5rem; }
  .about { color: #444; margin-bottom: 1.5rem; }
  .about a { color: inherit; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .5rem; font: inherit; border: 1px solid #ccc; border-radius: 4px; }
  select { padding: .5rem; font: inherit; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: .5rem 1.2rem; font: inherit; cursor: pointer; }
  .timing { color: #666; font-size: .85em; margin: .5rem 0 0; }
  .result { padding: 1rem 0; border-bottom: 1px solid #eee; }
  .result h2 { font-size: 1rem; margin: 0 0 .25rem; }
  .result .snippet { margin: .25rem 0; color: #222; }
  .result .meta { color: #666; font-size: .85em; margin: 0; }
  .error { color: #b00; }
  a { color: inherit; }
  .logout { position: absolute; top: 3rem; right: 1rem; }
  .logout button { background: none; border: none; text-decoration: underline; padding: 0; font: inherit; color: inherit; }
</style>

<form class="logout" method="post" action="/logout"><button type="submit">Log out</button></form>

<h1>Knowledge Base</h1>
<p class="about">
  A test page for knowledge-base retrieval — the passages an agent would get back for a query.
  <a href="/sources">Add a source</a> to grow it.
</p>

<form id="searchForm">
  <input id="query" placeholder="How do managed agents stream events?" autofocus>
  <select id="pageType" aria-label="Page type">
    <option value="">All types</option>
    <option value="documentation">Documentation</option>
    <option value="instruction">Instruction</option>
    <option value="knowledge">Knowledge</option>
    <option value="product">Product</option>
    <option value="blog">Blog</option>
    <option value="other">Other</option>
  </select>
  <button type="submit">Search</button>
</form>

<p id="timing" class="timing"></p>
<div id="results"></div>

<script>
  const SERVICE = "/knowledge_base.v1.KnowledgeBaseService";
  const SNIPPET_CHARS = 280;
  const results = document.getElementById("results");
  const timing = document.getElementById("timing");
  let inFlight = new AbortController();

  async function callKnowledgeBaseRpc(method, message, signal) {
    const res = await fetch(`${SERVICE}/${method}`, {
      method: "POST",
      headers: { "content-type": "application/json", "connect-protocol-version": "1" },
      body: JSON.stringify(message),
      signal,
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || `${method} failed with ${res.status}`);
    return body;
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function sourceLink(sourceId, text) {
    if (!/^https?:\/\//.test(sourceId)) return document.createTextNode(text);
    const link = element("a", "", text);
    link.href = sourceId;
    link.target = "_blank";
    link.rel = "noopener";
    return link;
  }

  function shorten(text) {
    const characters = Array.from(text);
    return characters.length > SNIPPET_CHARS ? `${characters.slice(0, SNIPPET_CHARS).join("").trimEnd()}…` : text;
  }

  function renderResult(result) {
    const div = element("div", "result");
    const title = element("h2");
    title.appendChild(sourceLink(result.sourceId, result.title));
    div.appendChild(title);
    div.appendChild(element("p", "snippet", shorten(result.snippet || result.summary || "")));
    const keywords = (result.keywords || []).join(", ");
    div.appendChild(element("p", "meta", [result.pageType, keywords].filter(Boolean).join(" · ")));
    return div;
  }

  document.getElementById("searchForm").onsubmit = async (event) => {
    event.preventDefault();
    inFlight.abort();
    inFlight = new AbortController();
    const { signal } = inFlight;
    const query = document.getElementById("query").value.trim();
    const pageType = document.getElementById("pageType").value;
    const start = performance.now();

    results.className = "";
    results.textContent = "Searching...";
    timing.textContent = "";

    try {
      const { results: hits } = await callKnowledgeBaseRpc(
        "Search",
        { query, pageTypes: pageType ? [pageType] : [] },
        signal,
      );
      if (signal.aborted) return;
      timing.textContent = `Searched in ${Math.round(performance.now() - start)} ms`;
      results.textContent = "";
      if (!hits || hits.length === 0) {
        results.textContent = "No matches.";
        return;
      }
      hits.forEach((hit) => results.appendChild(renderResult(hit)));
    } catch (err) {
      if (signal.aborted) return;
      results.textContent = err.message;
      results.className = "error";
    }
  };
</script>

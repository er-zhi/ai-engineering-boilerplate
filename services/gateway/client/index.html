<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index Service — Dev Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #111; }
    h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.25rem; margin-top: 1rem; }
    input[type="url"], input[type="text"] { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.875rem; }
    textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.875rem; font-family: monospace; min-height: 80px; resize: vertical; }
    button { margin-top: 1.5rem; padding: 0.5rem 1.25rem; background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem; }
    button:hover { background: #333; }
    #status, #search-results { margin-top: 1.5rem; padding: 1rem; background: #f5f5f5; border-radius: 4px; font-size: 0.875rem; white-space: pre-wrap; display: none; }
    .search-row { display: flex; gap: 0.5rem; margin-top: 2rem; }
    .search-row input { flex: 1; }
    .search-row button { margin-top: 0; }
    hr { margin: 2rem 0; border: none; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>Index Service — Dev Client</h1>

  <label for="base-url">Base URL</label>
  <input type="url" id="base-url" placeholder="https://example.com">

  <label for="include-patterns">Include patterns (one per line)</label>
  <textarea id="include-patterns" placeholder="/docs/*&#10;/blog/*"></textarea>

  <label for="exclude-patterns">Exclude patterns (one per line)</label>
  <textarea id="exclude-patterns" placeholder="*/admin/*&#10;*/login"></textarea>

  <label for="include-urls">Include URLs (one per line)</label>
  <textarea id="include-urls" placeholder="https://example.com/pricing"></textarea>

  <label for="exclude-urls">Exclude URLs (one per line)</label>
  <textarea id="exclude-urls" placeholder="https://example.com/private/page"></textarea>

  <button id="submit-btn">Start Indexing</button>
  <div id="status"></div>

  <hr>

  <div class="search-row">
    <input type="text" id="search-query" placeholder="Search indexed content...">
    <button id="search-btn">Search</button>
  </div>
  <div id="search-results"></div>

  <script>
    const API = window.location.origin;

    function lines(id) {
      return document.getElementById(id).value
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);
    }

    document.getElementById('submit-btn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.style.display = 'block';
      status.textContent = 'Submitting...';

      const body = {
        base_url: document.getElementById('base-url').value,
        include_patterns: lines('include-patterns'),
        exclude_patterns: lines('exclude-patterns'),
        include_urls: lines('include-urls'),
        exclude_urls: lines('exclude-urls'),
      };

      try {
        const res = await fetch(`${API}/api/crawl`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        status.textContent = res.ok
          ? `Job started: ${JSON.stringify(data, null, 2)}`
          : `Error ${res.status}: ${JSON.stringify(data, null, 2)}`;
      } catch (e) {
        status.textContent = `Failed: ${e.message}`;
      }
    });

    document.getElementById('search-btn').addEventListener('click', async () => {
      const q = document.getElementById('search-query').value;
      const el = document.getElementById('search-results');
      el.style.display = 'block';
      el.textContent = 'Searching...';

      try {
        const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        el.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        el.textContent = `Failed: ${e.message}`;
      }
    });
  </script>
</body>
</html>

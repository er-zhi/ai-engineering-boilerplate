[package]
name = "engine"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
axum = { workspace = true }
buffa = { workspace = true }
chrono = { workspace = true }
common = { workspace = true }
connectrpc = { workspace = true, features = ["axum", "client"] }
cron = { workspace = true }
engine-core = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
common = { workspace = true, features = ["test-support"] }
# The integration tests under `tests/` link engine as an external crate, so they only see
# `engine::test_db` when engine's own test-support feature is on. Depending on ourselves turns it
# on for test targets alone, so `cargo nextest run --workspace` compiles without `--all-features`.
engine = { path = ".", features = ["test-support"] }
engine-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[features]
test-support = ["common/test-support"]

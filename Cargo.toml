[workspace]
members = ["common", "services/crawler", "services/frontend", "services/gateway"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
connectrpc = "0.9"
connectrpc-build = "0.9"
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
serde = { version = "1", features = ["derive"] }
axum = "0.8"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
regex = "1"
dom_smoothie = "0.18"
sha2 = "0.11"
# Plain HTTP crawling only: rustls instead of OpenSSL, and none of the default io_uring/disk/browser extras.
spider = { version = "2.53", default-features = false, features = ["sync", "regex", "reqwest_rustls_tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
common = { path = "common" }

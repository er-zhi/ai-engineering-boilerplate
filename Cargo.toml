[workspace]
members = ["common", "engine-core", "services/chat", "services/crawler", "services/engine", "services/gateway", "services/knowledge-base", "services/llm-router", "services/tool"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
dbg_macro = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# Debug builds carried full debug info, and nothing ever removed the artefacts of dependency
# versions that had moved on: one long session of rebuilds grew `target/` to 129 GB across 458k
# files and filled the disk. `line-tables-only` keeps what a panic backtrace actually reads — file
# and line — and drops the variable and type tables a debugger would want, which is the bulk of it.
# Reach for `debug = true` in a profile of your own on the day you attach a debugger.
[profile.dev]
debug = "line-tables-only"

# Tests are built in their own profile and are most of the binaries in the workspace.
[profile.test]
debug = "line-tables-only"

[workspace.dependencies]
connectrpc = "0.9"
connectrpc-build = "0.9"
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
serde = { version = "1", features = ["derive"] }
schemars = "1.2"
axum = "0.8"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
regex = "1"
# `gzip`/`brotli`: a page is asked for compressed and decompressed here. Measured on real
# pages a fetch actually pulls — a 741 KB news page arrives as 100 KB and takes 204 ms
# instead of 720 ms. The body caps still count decompressed bytes, so nothing gets laxer.
reqwest = { version = "0.13", default-features = false, features = ["brotli", "charset", "gzip", "http2", "json", "rustls"] }
serde_json = "1"
dom_smoothie = "0.18"
scraper = "0.25"
url = "2.5"
sha2 = "0.11"
cron = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Entity-first: schema sync creates missing tables and columns from the entities on startup.
sea-orm = { version = "2.0", default-features = false, features = ["macros", "with-chrono", "with-json", "with-uuid", "postgres-array", "postgres-vector", "sqlx-postgres", "runtime-tokio-rustls", "schema-sync", "entity-registry"] }
pgvector = "0.4"
testcontainers = "0.28"
# Plain HTTP crawling only: rustls instead of OpenSSL, and none of the default io_uring/disk/browser extras.
spider = { version = "2.53", default-features = false, features = ["sync", "regex", "reqwest_rustls_tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
rand = "0.9"
proptest = "1"
thiserror = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
common = { path = "common", version = "0.1.0" }
engine-core = { path = "engine-core", version = "0.1.0" }
http = "1"
tokio-stream = "0.1"
futures = "0.3"

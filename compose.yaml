# The whole stack in one file: release images under hard resource limits. `docker compose up --watch` rebuilds a service's image on save.
x-rebuild-on-save: &rebuild-on-save
  watch:
    - action: rebuild
      path: .

configs:
  postgres-bootstrap:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;

      \getenv crawler_password CRAWLER_DB_PASSWORD
      CREATE ROLE crawler_user LOGIN PASSWORD :'crawler_password';
      CREATE SCHEMA crawler AUTHORIZATION crawler_user;
      ALTER ROLE crawler_user SET search_path TO crawler, public;

      \getenv gateway_password GATEWAY_DB_PASSWORD
      CREATE ROLE gateway_user LOGIN PASSWORD :'gateway_password';
      CREATE SCHEMA gateway AUTHORIZATION gateway_user;
      ALTER ROLE gateway_user SET search_path TO gateway, public;

      \getenv llm_router_password LLM_ROUTER_DB_PASSWORD
      CREATE ROLE llm_router_user LOGIN PASSWORD :'llm_router_password';
      CREATE SCHEMA llm_router AUTHORIZATION llm_router_user;
      ALTER ROLE llm_router_user SET search_path TO llm_router, public;

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      CRAWLER_DB_PASSWORD: ${CRAWLER_DB_PASSWORD:?set it in .env, see .env.example}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set it in .env, see .env.example}
      LLM_ROUTER_DB_PASSWORD: ${LLM_ROUTER_DB_PASSWORD:?set it in .env, see .env.example}
    configs:
      - source: postgres-bootstrap
        target: /docker-entrypoint-initdb.d/init.sql
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m

  crawler:
    build:
      dockerfile: services/crawler/Dockerfile
    develop: *rebuild-on-save
    environment:
      CRAWL_MAX_PAGES:
      DATABASE_URL: postgres://crawler_user:${CRAWLER_DB_PASSWORD:?set it in .env, see .env.example}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: 1
    mem_limit: 192m
    memswap_limit: 192m

  frontend:
    build:
      dockerfile: services/frontend/Dockerfile
    develop: *rebuild-on-save
    init: true
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 32m
    memswap_limit: 32m

  gateway:
    build:
      dockerfile: services/gateway/Dockerfile
    develop: *rebuild-on-save
    ports:
      - "8080:8080"
    environment:
      CRAWLER_URL: http://crawler:8081
      FRONTEND_URL: http://frontend:8082
    depends_on:
      crawler:
        condition: service_healthy
      frontend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 64m
    memswap_limit: 64m

volumes:
  pgdata:

# The whole stack in one file: release images under hard resource limits. `docker compose up --watch` rebuilds a service's image on save.
x-rebuild-on-save: &rebuild-on-save
  watch:
    - action: rebuild
      path: .

configs:
  postgres-bootstrap:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;

      \getenv crawler_password CRAWLER_DB_PASSWORD
      CREATE ROLE crawler_user LOGIN PASSWORD :'crawler_password';
      CREATE SCHEMA crawler AUTHORIZATION crawler_user;
      ALTER ROLE crawler_user SET search_path TO crawler, public;

      \getenv gateway_password GATEWAY_DB_PASSWORD
      CREATE ROLE gateway_user LOGIN PASSWORD :'gateway_password';
      CREATE SCHEMA gateway AUTHORIZATION gateway_user;
      ALTER ROLE gateway_user SET search_path TO gateway, public;

      \getenv llm_router_password LLM_ROUTER_DB_PASSWORD
      CREATE ROLE llm_router_user LOGIN PASSWORD :'llm_router_password';
      CREATE SCHEMA llm_router AUTHORIZATION llm_router_user;
      ALTER ROLE llm_router_user SET search_path TO llm_router, public;

      \getenv knowledge_base_password KNOWLEDGE_BASE_DB_PASSWORD
      CREATE ROLE knowledge_base_user LOGIN PASSWORD :'knowledge_base_password';
      CREATE SCHEMA knowledge_base AUTHORIZATION knowledge_base_user;
      ALTER ROLE knowledge_base_user SET search_path TO knowledge_base, public;
      -- pgvector's HNSW default ef_search (40) is below the 50 passages a retriever asks for, and a
      -- page-type filter is applied after the index scan; iterative scans keep reading until LIMIT is met.
      ALTER ROLE knowledge_base_user SET hnsw.ef_search = 100;
      ALTER ROLE knowledge_base_user SET hnsw.iterative_scan = strict_order;

      \getenv engine_password ENGINE_DB_PASSWORD
      CREATE ROLE engine_user LOGIN PASSWORD :'engine_password';
      CREATE SCHEMA engine AUTHORIZATION engine_user;
      ALTER ROLE engine_user SET search_path TO engine, public;

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      CRAWLER_DB_PASSWORD: ${CRAWLER_DB_PASSWORD:?set it in .env, see .env.example}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set it in .env, see .env.example}
      LLM_ROUTER_DB_PASSWORD: ${LLM_ROUTER_DB_PASSWORD:?set it in .env, see .env.example}
      KNOWLEDGE_BASE_DB_PASSWORD: ${KNOWLEDGE_BASE_DB_PASSWORD:?set it in .env, see .env.example}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:?set it in .env, see .env.example}
    configs:
      - source: postgres-bootstrap
        target: /docker-entrypoint-initdb.d/init.sql
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m

  crawler:
    build:
      dockerfile: services/crawler/Dockerfile
    develop: *rebuild-on-save
    environment:
      CRAWL_MAX_PAGES:
      SPIDER_MAX_SIZE_BYTES: 5242880
      KNOWLEDGE_BASE_URL: http://knowledge-base:8084
      DATABASE_URL: postgres://crawler_user:${CRAWLER_DB_PASSWORD:?set it in .env, see .env.example}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
      knowledge-base:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: 1
    mem_limit: 192m
    memswap_limit: 192m

  knowledge-base:
    build:
      dockerfile: services/knowledge-base/Dockerfile
    develop: *rebuild-on-save
    environment:
      LLM_ROUTER_URL: http://llm-router:8083
      # native/embedder-ane, run directly on the Mac host (Apple M1+, Neural Engine) — never in
      # Docker, there is no Linux/container equivalent of Core ML. See its README before `up`.
      EMBEDDER_URL: ${EMBEDDER_URL:-http://host.docker.internal:8086}
      DATABASE_URL: postgres://knowledge_base_user:${KNOWLEDGE_BASE_DB_PASSWORD:?set it in .env, see .env.example}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
      llm-router:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 96m
    memswap_limit: 96m

  frontend:
    build:
      dockerfile: services/frontend/Dockerfile
    develop: *rebuild-on-save
    volumes:
      - frontend-dist:/shared
    # One-shot: copies the client bundle into the shared volume and exits. No restart policy — a
    # completed job is not a crash, and `service_completed_successfully` below is what gates Gateway.
    cpus: 0.1
    mem_limit: 16m
    memswap_limit: 16m

  llm-router:
    build:
      dockerfile: services/llm-router/Dockerfile
    develop: *rebuild-on-save
    environment:
      # The only service given the provider key.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set it in .env, see .env.example}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_LOW_PRIMARY:
      LLM_LOW_BACKUP:
      LLM_MEDIUM_PRIMARY:
      LLM_MEDIUM_BACKUP:
      LLM_HIGH_PRIMARY:
      LLM_HIGH_BACKUP:
      DATABASE_URL: postgres://llm_router_user:${LLM_ROUTER_DB_PASSWORD:?set it in .env, see .env.example}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 96m
    memswap_limit: 96m

  engine:
    build:
      dockerfile: services/engine/Dockerfile
    develop: *rebuild-on-save
    environment:
      LLM_ROUTER_URL: http://llm-router:8083
      DATABASE_URL: postgres://engine_user:${ENGINE_DB_PASSWORD:?set it in .env, see .env.example}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
      llm-router:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m

  gateway:
    build:
      dockerfile: services/gateway/Dockerfile
    develop: *rebuild-on-save
    ports:
      - "8080:8080"
    volumes:
      - frontend-dist:/frontend:ro
    environment:
      CRAWLER_URL: http://crawler:8081
      KNOWLEDGE_BASE_URL: http://knowledge-base:8084
      GATEWAY_AUTH_PASSWORD: ${GATEWAY_AUTH_PASSWORD:?set it in .env, see .env.example}
      GATEWAY_SESSION_TTL_HOURS:
      DATABASE_URL: postgres://gateway_user:${GATEWAY_DB_PASSWORD:?set it in .env, see .env.example}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
      crawler:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
      knowledge-base:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 64m
    memswap_limit: 64m

volumes:
  pgdata:
  frontend-dist:
